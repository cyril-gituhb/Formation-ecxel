<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="google-site-verification" content="IroNbFQ_1fITWkuZcoufSlIxAJ4PVPz7RKwwr_o6Gqo" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Inscription - Formation Excel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .deadline-message {
            padding: 40px;
            text-align: center;
            color: #d32f2f;
        }

        .deadline-message h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .deadline-message p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Formation Excel</h1>
            <p>Formulaire d'inscription</p>
        </div>

        <div id="message" class="message"></div>
        <form id="inscriptionForm">
          
          <label>Nom *</label>
          <input type="text" name="nom" required>

          <label>Post-nom</label>
          <input type="text" name="postnom">

          <label>Prénom *</label>
          <input type="text" name="prenom" required>

          <label>Numéro WhatsApp *</label>
          <input type="tel" name="numero" placeholder="+243..." required>

          <label>Âge</label>
          <input type="number" name="age" min="15" max="80">

          <label>Pays</label>
          <input type="text" name="pays">

          <label>Photo d'identité</label>
          <input type="file" name="photo" accept="image/*">

          <hr>

          <label>Niveau *</label>
          <select name="niveau" required>
            <option value="">-- Sélectionnez un niveau --</option>
            <option value="Débutant">Débutant</option>
            <option value="Intermédiaire">Intermédiaire</option>
            <option value="Avancé">Avancé</option>
          </select>

          <label>Date de démarrage souhaitée *</label>
          <input type="date" name="date" required>

          <label>Modules d'intérêt</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" name="modules" value="Bases d'Excel" id="mod1">
              <label for="mod1">Bases d'Excel</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" name="modules" value="Formules et Fonctions" id="mod2">
              <label for="mod2">Formules et Fonctions</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" name="modules" value="Graphiques et Visualisation" id="mod3">
              <label for="mod3">Graphiques et Visualisation</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" name="modules" value="Tableaux Croisés Dynamiques" id="mod4">
              <label for="mod4">Tableaux Croisés Dynamiques</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" name="modules" value="VBA et Macros" id="mod5">
              <label for="mod5">VBA et Macros</label>
            </div>
          </div>

          <label>Avez-vous déjà utilisé Excel ? *</label>
          <div class="radio-group">
            <div class="checkbox-item">
              <input type="radio" name="experience" value="Oui" id="exp1" required>
              <label for="exp1">Oui</label>
            </div>
            <div class="checkbox-item">
              <input type="radio" name="experience" value="Non" id="exp2" required>
              <label for="exp2">Non</label>
            </div>
          </div>

          <label>Commentaires additionnels</label>
          <textarea name="commentaires" placeholder="Parlez-nous de vos objectifs..."></textarea>

          <label>
            <input type="checkbox" name="conditions" required> J'accepte les conditions d'utilisation *
          </label>

          <div class="button-group">
            <button type="submit" class="btn-submit">S'inscrire</button>
            <button type="reset" class="btn-reset">Réinitialiser</button>
          </div>
        </form>
    </div>

    <script>
const DEADLINE = new Date("2026-05-20T11:00:00"); // 20 mai 2026, 08h00

// Vérifie à l'ouverture de la page
window.addEventListener('DOMContentLoaded', function() {
  const now = new Date();
  
  if (now > DEADLINE) {
    document.getElementById('inscriptionForm').innerHTML = `
      <div class="deadline-message">
        <h2>Inscriptions fermées</h2>
        <p>La date limite était le 20/05/2026 à 08h00.</p>
        <p>veuillez contacter notre assistant CYRIL NDIMBA :+243970709671!</p>
      </div>
    `;
  }
});

// Vérifie à la soumission aussi
document.getElementById('inscriptionForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const now = new Date();
  
  if (now > DEADLINE) {
    alert("Désolé, les inscriptions sont fermées depuis le 20/05/2026 à 08h00.");
    return;
  }
  
  const formData = new FormData(this);
  
  let message = "🔔 Nouvelle inscription Formation Excel:%0A%0A";
  message += "👤 Nom: " + formData.get('nom') + "%0A";
  message += "👤 Post-nom: " + (formData.get('postnom') || '-') + "%0A";
  message += "👤 Prénom: " + formData.get('prenom') + "%0A";
  message += "📱 Numéro: " + formData.get('numero') + "%0A";
  message += "🎂 Âge: " + (formData.get('age') || '-') + "%0A";
  message += "🌍 Pays: " + (formData.get('pays') || '-') + "%0A";
  message += "📊 Niveau: " + formData.get('niveau') + "%0A";
  message += "📅 Date: " + formData.get('date') + "%0A";
  message += "📚 Modules: " + (formData.getAll('modules').join(', ') || '-') + "%0A";
  message += "💻 Déjà utilisé Excel: " + formData.get('experience') + "%0A";
  message += "💬 Commentaires: " + (formData.get('commentaires') || '-') + "%0A";
  
  if(formData.get('photo') && formData.get('photo').name) {
    message += "%0A⚠️ La personne a ajouté une photo. Demande-lui de l'envoyer après.";
  }

  window.open("https://wa.me/243858481105?text=" + message, "_blank");
  alert("Merci ! WhatsApp va s'ouvrir avec les infos.");
});
    </script>
</body>
</html>
