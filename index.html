<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Inscription - Formation Excel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Formation Excel</h1>
            <p>Formulaire d'inscription</p>
        </div>

        <div id="message" class="message"></div>

        <form id="inscriptionForm">
            <!-- Informations Personnelles -->
            <div class="form-group">
                <label for="nom">Nom *</label>
                <input type="text" id="nom" name="nom" placeholder="Nom" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone *</label>
                <input type="tel" id="telephone" name="telephone" placeholder="Téléphone" required>
            </div>

            <!-- Formation -->
            <div class="form-group">
                <label for="niveau">Niveau *</label>
                <select id="niveau" name="niveau" required>
                    <option value="">-- Sélectionnez un niveau --</option>
                    <option value="Débutant">Débutant</option>
                    <option value="Intermédiaire">Intermédiaire</option>
                    <option value="Avancé">Avancé</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date de démarrage souhaitée *</label>
                <input type="date" id="date" name="date" required>
            </div>

            <!-- Modules d'Intérêt -->
            <div class="form-group">
                <label>Modules d'intérêt (plusieurs choix possibles) *</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="module1" name="modules" value="Bases d'Excel">
                        <label for="module1">Bases d'Excel</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="module2" name="modules" value="Formules et Fonctions">
                        <label for="module2">Formules et Fonctions</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="module3" name="modules" value="Graphiques et Visualisation">
                        <label for="module3">Graphiques et Visualisation</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="module4" name="modules" value="Tableaux Croisés Dynamiques">
                        <label for="module4">Tableaux Croisés Dynamiques</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="module5" name="modules" value="VBA et Macros">
                        <label for="module5">VBA et Macros</label>
                    </div>
                </div>
            </div>

            <!-- Expérience -->
            <div class="form-group">
                <label>Avez-vous déjà utilisé Excel ? *</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="radio" id="expeYes" name="experience" value="Oui" required>
                        <label for="expeYes">Oui</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="radio" id="expeNo" name="experience" value="Non" required>
                        <label for="expeNo">Non</label>
                    </div>
                </div>
            </div>

            <!-- Commentaires -->
            <div class="form-group">
                <label for="commentaires">Commentaires additionnels</label>
                <textarea id="commentaires" name="commentaires" placeholder="Parlez-nous de vos objectifs..."></textarea>
            </div>

            <!-- Conditions -->
            <div class="form-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">J'accepte les conditions d'utilisation *</label>
                </div>
            </div>

            <!-- Boutons -->
            <div class="button-group">
                <button type="submit" class="btn-submit">S'inscrire</button>
                <button type="reset" class="btn-reset">Réinitialiser</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('inscriptionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            let message = "Nouvelle inscription Formation Excel:%0A";
            message += "Nom: " + formData.get('nom') + "%0A";
            message += "Email: " + formData.get('email') + "%0A";
            message += "Téléphone: " + formData.get('telephone') + "%0A";
            message += "Niveau: " + formData.get('niveau') + "%0A";
            message += "Date: " + formData.get('date') + "%0A";
            message += "Modules: " + formData.getAll('modules').join(', ') + "%0A";
            message += "Déjà utilisé Excel: " + formData.get('experience') + "%0A";
            message += "Commentaires: " + formData.get('commentaires');
            
            // Ouvre WhatsApp avec le message
            window.open("https://wa.me/243858481105?text=" + message, "_blank");
        });
    </script>
</body>
</html>
