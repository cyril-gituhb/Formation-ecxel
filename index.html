<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Inscription - Formation Excel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Formation Excel</h1>
            <p>Formulaire d'inscription</p>
        </div>

        <div id="message" class="message"></div>

        <form id="inscriptionForm">
          
          <label>Niveau *</label>
          <select name="niveau" required>
            <option value="">-- Sélectionnez un niveau --</option>
            <option value="Débutant">Débutant</option>
            <option value="Intermédiaire">Intermédiaire</option>
            <option value="Avancé">Avancé</option>
          </select>

          <label>Date de démarrage souhaitée *</label>
          <input type="date" name="date" required>

          <label>Modules d'intérêt (plusieurs choix possibles)</label>
          <div>
            <input type="checkbox" name="modules" value="Bases d'Excel"> Bases d'Excel<br>
            <input type="checkbox" name="modules" value="Formules et Fonctions"> Formules et Fonctions<br>
            <input type="checkbox" name="modules" value="Graphiques et Visualisation"> Graphiques et Visualisation<br>
            <input type="checkbox" name="modules" value="Tableaux Croisés Dynamiques"> Tableaux Croisés Dynamiques<br>
            <input type="checkbox" name="modules" value="VBA et Macros"> VBA et Macros<br>
          </div>

          <label>Avez-vous déjà utilisé Excel ? *</label>
          <div>
            <input type="radio" name="experience" value="Oui" required> Oui
            <input type="radio" name="experience" value="Non" required> Non
          </div>

          <label>Commentaires additionnels</label>
          <textarea name="commentaires" placeholder="Parlez-nous de vos objectifs..."></textarea>

          <label>
            <input type="checkbox" name="conditions" required> J'accepte les conditions d'utilisation *
          </label>

          <div class="button-group">
            <button type="submit">S'inscrire</button>
            <button type="reset">Réinitialiser</button>
          </div>
        </form>
    </div>

    <script>
document.getElementById('inscriptionForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = new FormData(this);
  
  let message = "🔔 Nouvelle inscription Formation Excel:%0A%0A";
  message += "📊 Niveau: " + formData.get('niveau') + "%0A";
  message += "📅 Date de démarrage: " + formData.get('date') + "%0A";
  message += "📚 Modules: " + (formData.getAll('modules').join(', ') || 'Aucun') + "%0A";
  message += "💻 Déjà utilisé Excel: " + formData.get('experience') + "%0A";
  message += "💬 Commentaires: " + (formData.get('commentaires') || 'Aucun') + "%0A";

  // Ouvre WhatsApp avec le message pré-rempli
  window.open("https://wa.me/243858481105?text=" + message, "_blank");
  
  // Message de confirmation
  alert("Merci ! WhatsApp va s'ouvrir pour finaliser l'inscription.");
});
    </script>
</body>
</html>
